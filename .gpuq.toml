# .gpuq.toml — how arc-whest jobs reach the shared workload queue.
#
# A queued job runs a FROZEN GIT SNAPSHOT of this tree taken at submission time.
# That snapshot contains tracked files, uncommitted edits and untracked
# non-ignored files — but NOT gitignored paths. Every gitignored path a job
# needs at runtime must be listed below, or the job dies with
# "No such file or directory".
#
# Passthrough entries are junctions/symlinks back to the LIVE path, never
# copies, so the 3.2 GB weight cache and the four venvs cost nothing to link.
#
# TWO CONSEQUENCES THAT MATTER HERE, both recorded in AGENTS.md § The workload
# queue:
#
#   1. A passthrough is a link to live data. A job that WRITES through one
#      writes into the real repository. That is what we want for regenerable
#      caches (*.f32, truth npz) and what we must not do carelessly to
#      anything else.
#   2. Everything NOT passed through is snapshot-local. An artifact written to
#      a relative path under experiments/ lands in the snapshot and is DELETED
#      when `gpuq cleanup` expires it. Always give heavy jobs an ABSOLUTE
#      output path under C:/Users/samsu/Documents/arc-whest/experiments/.
#
# The 16 GB HuggingFace dataset cache lives in ~/.cache/huggingface, outside the
# repository, so it is untouched by snapshotting and needs no entry.

[project]
name = "arc-whest"

[snapshot]
passthrough = [
  # --- interpreters -------------------------------------------------------
  # All four are gitignored (.venv-gpu by its own uv-written .gitignore) and
  # all four are load-bearing; docs/SETUP_WINDOWS.md § 2 says which is which.
  ".venv",          # official stack: WhestBench 0.16 / flopscope 0.12, no torch
  ".venv-gpu",      # torch + CUDA, no whestbench — the GPU truth mirror
  ".venv-fs010",    # flopscope 0.10 only — p2_flop_anchor.py's two-sided run
  ".venv-fs012",    # flopscope 0.12 + numpy, no whestbench — p2_price_delta.py

  # --- data a job reads at a repo-relative path ---------------------------
  # Ignored by `*.npz` / `*.f32`, but resolved from _ROOT = the snapshot root,
  # so they are invisible to a job unless linked here.
  "local_sim/sobol_dirnum.npz",                       # Sobol direction numbers

  # --- the pinned public reference tree, gitignored (`.gitignore:57 external/`)
  # The 2026-09-17b reciprocal program-swap experiment runs public v17 and v29
  # unmodified as DIAGNOSTIC arms and parses their term tables, so a job that
  # cannot see this path dies at import (job 1657). It is read-only reference
  # material: nothing writes through it, and none of its bytes reach a
  # candidate or a submission.
  "external/504aldo",                                 # 2.8 MB, read-only
  "experiments/2026-08-21_p2_cp1/truth_P01.npz",      # P01 labels, 1024x16
  "experiments/2026-09-16_p11/truth_P11.npz",         # P11 labels, 1024x16 -- Slice 7 accuracy corpus
  "experiments/2026-09-17b_p12/truth_P12.npz",        # P12 labels, 1024x16 -- slice 2026-09-17b DESIGN panel
  "experiments/2026-09-17b_p13/truth_P13.npz",        # P13 labels, 1024x16 -- slice 2026-09-17b SINGLE_USE DECIDE
  "experiments/2026-08-26_p2_cal/weights_P01.f32",    # 3.2 GB float32 cache
  "experiments/2026-08-26_p2_gt/gt_halfA.npz",
  "experiments/2026-08-26_p2_gt/gt_halfB.npz",
  "experiments/2026-08-26_p2_gt/shards",              # 24 per-net shards
  "experiments/2026-08-19_carriers/oa_truth_D18.npz",
  "experiments/2026-08-27_pa_confirm/mini_labels.npz",
  "experiments/2026-08-28_weff/parity_fnp.npz",
  "experiments/fusion_data/full_fusion_data.npz",
  "experiments/fusion_data/mini_fusion_data.npz",
  "experiments/fusion_data/gpu_mint_50000x65536.npz",
  "experiments/fusion_data/g1_3000x8_N16384.npz",
  "experiments/fusion_data/g2_points_4096.npz",
  "experiments/fusion_data/parity_mlps.npz",
  "experiments/packed/D11_truth_256x32.npz",
  "experiments/packed/D12_truth_256x32.npz",
  "experiments/packed/D13_truth_256x32.npz",
  "experiments/packed/D14_truth_256x32.npz",
  "experiments/sprint3_robustness/robust_1200fresh.npz",
  "experiments/sprint3_robustness/robust_stress_600.npz",
  "experiments/sprint3_robustness/figure_data.npz",
  # --- the v57 corrector's training corpus (HANDOFF 09-24 Step 2) ---------
  # Written by `tools/anatomy.py --dump`; gitignored by `*.npz`, so a queued
  # fit cannot see them without these two lines. 61 MB + 185 MB, read-only to
  # the fit. Both exceed the 50 MiB auto-send limit, so a job declaring them
  # can only be placed where they already exist (this machine) until staged.
  "experiments/2026-09-24_corr/train_fit100.npz",     # FIT 100 nets
  "experiments/2026-09-24_corr/train_hold300.npz",    # pinned HOLDOUT-300
  # --- keenanpepper's public MC labels (PLAN rev 13 decision 3), fetched by
  # tools/labels/fetch.py. `cache/hf/` holds no tracked file, so the directory
  # itself links. ~6.6 GB, read-only to every job; local-only until staged.
  "cache/hf",
  "cache/d8b",        # d8b corpus shards + d8b_mean.npy (twin --train-panel train+d8b), ~0.6 GB
  "cache/twin",       # tools/twin/export_weights.py memmaps, ~74 GB; written through
  "experiments/vault/vault_v1.npz",
  "experiments/vault/mirror_preds.npz",
  "experiments/vault/sacrificial_preds.npz",
]

# NOTE ON DIRECTORY ENTRIES: a passthrough whose destination already exists in
# the snapshot is silently SKIPPED (gpuq/snapshot.py::apply_passthrough). Every
# experiments/<slice>/ directory here also holds tracked files, so it exists in
# the snapshot and a directory-level entry would do nothing. The ignored files
# are therefore listed one by one. `shards/` is the single exception: it holds
# no tracked file, so the directory itself can be linked.
